\* Negative model: writes can tear, the restore guard is in force, and a torn
\* tuple the guard accepts still contradicts an answer already given. This is
\* the uncatchable half of the module's pair and its central result: the
\* accepted mix is a state some honest run of the register reaches, so every
\* rule that reads the tuple alone passes it and only the history says
\* otherwise. Whole-tuple atomicity is the defence, not the restore.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    DurableRestoreKeepsEveryAnswer
CHECK_DEADLOCK FALSE
