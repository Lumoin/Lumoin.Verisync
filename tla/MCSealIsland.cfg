\* This negative model exposes the straggler-wedge family with partitions
\* enabled. A partitioned member sealing its own locally-quiescent frontier
\* commits a frontier the group can neither apply nor gossip across; the
\* shortest wedge in the family needs no partition at all - a lagging member
\* left behind by a base-changing seal, wedged by the same generation-fence
\* mechanism. TLC MUST report a GroupConverges violation; a green run means
\* the model lost the wedge entirely. Partition interleavings are exercised
\* for safety by MCSealSafety.
SPECIFICATION FairSpec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    MaxC = 1
    AllowAdopt = FALSE
    AllowPartition = TRUE
    SealGuard = FALSE
    WriteBarrier = FALSE
    NoCommit = NoCommit
PROPERTIES
    GroupConverges
CHECK_DEADLOCK FALSE
