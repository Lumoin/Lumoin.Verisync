\* Negative model: the Figure 8 restriction is withdrawn, so a leader may count
\* replicas to commit an entry created in an earlier term. A server that never
\* held that entry can still satisfy the election restriction and win a later
\* term, and its log then lacks a committed entry.
SPECIFICATION Spec
CONSTANTS
    Servers = {s1, s2, s3, s4, s5}
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    s5 = s5
    MaxTerm = 5
    MaxLogLength = 2
    CommitRequiresCurrentTerm = FALSE
    CountsOnlyPersistedReplicas = TRUE
    CrashesEnabled = FALSE
    NoLeader = NoLeader
INVARIANTS
    LeaderCompleteness
SYMMETRY ServerSymmetry
CHECK_DEADLOCK FALSE
