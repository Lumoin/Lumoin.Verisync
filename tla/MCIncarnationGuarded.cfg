\* The detector on: an identity is bound to the incarnation that first answered for it, so a
\* second store under one identity cannot record and no second quorum can form.
SPECIFICATION Spec

CONSTANTS
    Identities = {ia, ib, ic}
    Incarnations = {1, 2}
    Values = {v1, v2}
    Quorum = 2
    DetectorOn = TRUE
    BindingDurable = TRUE
    NoValue = noValue
    NoIncarnation = noIncarnation

INVARIANTS
    TypeOK
    Agreement
