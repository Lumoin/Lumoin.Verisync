\* The tearing green, and the module's one exhaustive run over the tear
\* alphabet. It certifies that no tear breaks the premise the host's
\* step-zero short circuit rests on - after the first completed write both
\* mix sources stand at or above the round's first step, so the durable step
\* never returns to zero - and that with the guard in force the register
\* never stands in a state a recorder-driven register cannot hold. It omits
\* the two served-stability invariants because tearing breaks them; the
\* negatives beside it are what that is for. Every tearing action and both
\* arms of the restore guard are reached here, and the run measures what the
\* tear alphabet costs.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    TornTypeOK
    StepZeroDurableStateWasNeverServed
    RegisterHoldsOnlyRecorderStates
CHECK_DEADLOCK TRUE
