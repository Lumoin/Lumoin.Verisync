\* Negative model: the boundary of what atomicity buys. Writes are atomic and
\* the guard is in force, and a store that returns a tuple it was never given
\* still hands the restore an accepted state contradicting an answer already
\* given. Whole-tuple atomicity is a defence against tearing and is not a
\* defence against a lying store; that defence is a self-checking document,
\* which is outside this alphabet and recorded as such.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = TRUE
    StoreReturnsWhatItWrote = FALSE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    DurableRestoreKeepsEveryAnswer
CHECK_DEADLOCK FALSE
