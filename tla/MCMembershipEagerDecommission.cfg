\* Negative model: the decommission gate withdrawn, so an operator retires a host
\* without first confirming that the incoming configuration holds the newest
\* record.
\*
\* This is the one operator act in the whole arc that destroys a decision, and
\* the reason it is modelled rather than left to the runbook is that it has been
\* prose everywhere else this has been attempted. A decision installs the record
\* at its writer alone - the counted recorders have recorded rather than learned,
\* because dissemination is best effort and reports nothing - so immediately
\* after a version settles there is exactly one live holder. Retiring that host
\* leaves a decided version no live host can prove, and the register is wedged
\* with no recovery inside the protocol.
\*
\* The invariant is a possibility predicate: it says recovery remains possible,
\* never that it happens. Nothing in the library can enforce the gate either, so
\* what the red buys is that the rule is checked rather than that it is imposed.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = FALSE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    LatestDecisionSurvives
CHECK_DEADLOCK FALSE
