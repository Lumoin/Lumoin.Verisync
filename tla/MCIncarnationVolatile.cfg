\* The binding enforced but held only in the memory of the process that learned it. A replaced proposer
\* starts with none, so the second store under one identity records after all and a second quorum forms.
\* This is what says the binding must be derived from something durable rather than remembered.
SPECIFICATION Spec

CONSTANTS
    Identities = {ia, ib, ic}
    Incarnations = {1, 2}
    Values = {v1, v2}
    Quorum = 2
    DetectorOn = TRUE
    BindingDurable = FALSE
    NoValue = noValue
    NoIncarnation = noIncarnation

INVARIANTS
    TypeOK
    Agreement
