\* All three durability rules in force. The recorder answers only from state it
\* has made durable, a crash brings that state back, and the state is all four
\* register fields, so no crash takes back a summary a proposer has read.
SPECIFICATION Spec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
INVARIANTS
    TypeOK
    ServedFirstIsStable
    ServedPriorAggregateIsStable
    StepZeroDurableStateWasNeverServed
CHECK_DEADLOCK TRUE
