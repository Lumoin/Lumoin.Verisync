\* Negative model: a decision counted across two chains. The constants are
\* MCMembershipSplitGenesis's exactly, and the two differ only in the invariant
\* each lists, on the precedent the durability matrix already carries.
\*
\* They are separated because the two properties are reachable at different
\* depths. A fork needs two decisions to exist before Agreement can see it, while
\* one quorum mixing a host from each chain breaks this invariant at the first
\* decision. A single file listing both would report whichever TLC reached first
\* and the other would stop testing what it was written for.
\*
\* What the pair establishes together is the value of the chain identity rather
\* than only the cost of its absence: this configuration says the mixing is
\* reachable, its sibling says the fork that follows is reachable, and
\* MCMembershipGuardedGenesis says the identity check closes both at the same
\* constants.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- SplitMembers
    Cluster <- ClusterPerConfig
    Genesis <- SplitGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = FALSE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    NoCrossClusterDecision
CHECK_DEADLOCK FALSE
