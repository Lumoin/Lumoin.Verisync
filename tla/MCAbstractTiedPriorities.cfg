\* This negative model runs Algorithm 1 with the proposal key reduced to the
\* priority alone, so best is any proposal of maximal priority and two replicas
\* reading the same set can read different bests. This is the formal statement
\* of why Appendix A exists: the agreement proof rests on priorities never
\* tying, and neither tiebreaking nor tie detection is in force here. The
\* priority space is collapsed to one value so that every round ties, which is
\* the defect at full strength rather than at whatever rate two priorities
\* happen to collide. TLC MUST report an Agreement violation.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = FALSE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
SYMMETRY ValueSymmetry
CHECK_DEADLOCK FALSE
