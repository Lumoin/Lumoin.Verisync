\* This negative model reads the decision predicate off the common set, testing
\* best(C) = best(U) where Algorithm 1 tests best(E) = best(U). The common set
\* is contained in the existent set, so the wrong predicate fires on a round in
\* which a higher-priority proposal exists that the deciding replica never saw
\* was common, and a later round can carry that proposal to a different
\* decision. TLC MUST report an Agreement violation.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = TRUE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
SYMMETRY ValueSymmetry
CHECK_DEADLOCK FALSE
