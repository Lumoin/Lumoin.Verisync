\* The shipped protocol with partitions and adoption. The chain invariant and
\* the recorded-generation consistency (the observable behind the apply-side
\* digest verification) hold through every seal, apply, adoption and
\* partition interleaving.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    MaxC = 1
    AllowAdopt = TRUE
    AllowPartition = TRUE
    SealGuard = FALSE
    WriteBarrier = FALSE
    NoCommit = NoCommit
INVARIANTS
    TypeOK
    RecordedOnChain
    RecordedGenConsistent
CHECK_DEADLOCK FALSE
