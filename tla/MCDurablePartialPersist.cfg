\* Negative model: the durable state is the step and the first proposal alone,
\* which is what the persistence prose named before it was corrected. The first
\* proposal survives the crash and the prior aggregate does not, so the recorder
\* answers a different aggregate for a step it has already answered for, and
\* that aggregate is what a proposer's phase two compares its template against.
SPECIFICATION Spec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = FALSE
INVARIANTS
    ServedPriorAggregateIsStable
CHECK_DEADLOCK FALSE
