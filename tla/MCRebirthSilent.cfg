\* This negative model runs vertex-union-by-overwrite: a twice-run recovery
\* re-mints divergently and the silent merge flips a member's copy. TLC MUST
\* report a TagStability violation.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    Tags = {t1, t2}
    t1 = t1
    t2 = t2
    DetectorOn = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    TagStability
CHECK_DEADLOCK FALSE
