\* Two believed leaders with only the fast-path defence in force: the fast path
\* tests the whole proposal instead of its priority, and the recorders honour
\* the reserved priority from anyone. That is enough to make two fast decisions
\* agree, because two majorities that each recorded one proposal first must
\* intersect. It is not enough for the round, because a proposer whose quorum is
\* not uniform falls through to the best of its replies, and with two
\* reserved-priority proposals in play that best is settled by the proposer
\* identifier rather than by which proposal a majority already recorded. This
\* configuration is the reason the three defences are separate constants: it
\* isolates which of them is load-bearing. TLC MUST report an Agreement
\* violation.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
CHECK_DEADLOCK FALSE
