\* Algorithm 5 in place of Algorithm 1: the proposal key is the priority alone,
\* so two proposals can tie for best, and the decision predicate refuses to fire
\* unless the existent set's best is unique. Two priorities across three
\* replicas makes ties reachable in every round, so the defence is exercised
\* rather than merely permitted. This is the variation that is meant to stay
\* green under ties, and it is matched against MCAbstractTiedPriorities, which
\* is the same tie with no defence and goes red inside the first round.
\*
\* One round, deliberately. The pair is matched at the round in which the
\* negative fires, and an unordered key makes the round conclusion branch over
\* every reading each replica could take of two of its three sets, which is a
\* cost the second round cannot carry: at two rounds the state space does not
\* close in tractable time, where the ordered-key configurations finish in
\* minutes.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 1
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = FALSE
    TieDetection = TRUE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    CrossNodeSubset
    Cardinalities
SYMMETRY ValueSymmetry
CHECK_DEADLOCK TRUE
