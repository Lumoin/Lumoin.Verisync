\* The baseline swept upward in the one dimension that changes what best has to
\* order: three priorities rather than two, so a round can hold a strict ranking
\* of all three proposals as well as every tie pattern two priorities can make.
\* Everything else matches MCAbstractSafety. This configuration exists to record
\* how far the model stays exhaustive, and it is reported as verified only
\* because it is.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1, 2}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    CrossNodeSubset
    Cardinalities
SYMMETRY ValueSymmetry
CHECK_DEADLOCK TRUE
