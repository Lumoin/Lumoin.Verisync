\* The same protocol with one replica permitted to crash at any point in a
\* round, which is the f = 1 the three-replica configuration is sized for. A
\* replica that reached only some of its peers before stopping is covered: it is
\* live for that tcast and crashes after it.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {3}
    UniversalWitness = TRUE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    CrossNodeSubset
    Cardinalities
SYMMETRY ValueSymmetry
CHECK_DEADLOCK TRUE
