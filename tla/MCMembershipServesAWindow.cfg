\* Negative model: the version gate withdrawn, so a host answers for any instance
\* at or above the one it has caught up to instead of for exactly one.
\*
\* The gate is what makes a joiner unable to vote before it is ready, and it is
\* the reason this design needs no rule of its own for that obligation. With the
\* gate withdrawn the second instance can be decided by a quorum of the incoming
\* configuration whose members never learned the record that installed them, so
\* a decision is counted on hosts that cannot say what the previous version was.
\*
\* The trace is short and worth stating, because it is also the shape of the
\* hazard in the field: host 3 decides version one under {1,2,3} and installs
\* {3,4,5}; hosts 4 and 5 have learned nothing; with the gate off they answer for
\* version two anyway and are a quorum of it.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = FALSE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    DecisionsCountOnlyCaughtUpHosts
CHECK_DEADLOCK FALSE
