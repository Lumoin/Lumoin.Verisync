\* The closed cluster, where every message comes from a member. This is the
\* baseline: it says the model runs a whole election and that the results below
\* are about the sender identity rather than a mistake in the transcription.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3}
    Outsiders = {}
    MaxTerm = 1
    FilterNonMembers = TRUE
    FilterBeforeTermRule = FALSE
    InjectsReplies = FALSE
    InjectsRequests = FALSE
    Nil = Nil
INVARIANTS
    TypeOK
    ElectionSafety
    NoTermInflation
    VoteNamesAMember
CHECK_DEADLOCK FALSE
