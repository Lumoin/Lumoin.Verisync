\* Two believed leaders with only the declared-schedule defence in force: every
\* request carries the leader its proposer believes in, each recorder binds the
\* first declaration it serves for the instance, and it refuses any later request
\* naming a different one. This is the defence a reference implementation uses
\* and the one the other four configurations do not cover, because it is the only
\* one that needs no agreed configuration at the recorders - a recorder learns
\* the schedule instead of being told it.
\*
\* The claim under test is that refusal, unlike the downgrade the first-claim
\* binding performs, is enough on its own. A recorder holds exactly one binding,
\* so the recorders split into at most two groups and only the larger can be a
\* majority; the proposer that is wrong about the schedule is therefore blocked
\* rather than free to spread a losing proposal. TLC must report no error.
\*
\* Deadlock is not checked here, and that is the point rather than an oversight.
\* A blocked proposer never decides and never advances, so the run reaches
\* terminal states in which the protocol still had work to do. Those states are
\* the defence working, and the liveness they cost is what the comparison against
\* ReservedFromLeaderOnly has to weigh: that defence leaves the losing proposer
\* running through the ordinary phases, this one stops it.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = TRUE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK FALSE
