\* Negative model: a decision counts an answer from a host outside the instance's
\* configuration, which is what an endpoint slot wired to the wrong machine
\* produces and what a reply carrying no identity cannot rule out.
\*
\* This is the RaftElection Outsiders hazard at the recorder rather than at the
\* voter, and it is reachable here for the same reason it is reachable there:
\* Hosts is a strict superset of every configuration, so a message from somewhere
\* else is expressible at all. A specification quantifying answers over the
\* member set would make every answering host a member by construction and could
\* not ask the question.
\*
\* The endpoint array has exactly one slot per member, so the stranger occupies a
\* slot rather than adding one - which is why the model counts exactly a quorum
\* rather than at least one. The shipped defence is the reply identity checked at
\* the counting site, and it is exact under crash faults and worthless against a
\* host that lies about who it is.
\*
\* This configuration lists DecisionsCountOnlyMembers alone, and the invariant it
\* does not list is the one worth stating. Agreement is reachable here too, one
\* decision further on: strangers let two quorums at one version be disjoint, so
\* two records stand. The rule withdrawn here is therefore a safety rule and not
\* only a bookkeeping one, which is more than the reply-identity seam is usually
\* credited with. The merged run is what settles which invariant TLC reports
\* first, and the pin below is the shallower of the two.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = FALSE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    DecisionsCountOnlyMembers
CHECK_DEADLOCK FALSE
