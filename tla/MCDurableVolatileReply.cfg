\* Negative model: the persist-before-reply obligation is withdrawn, so the
\* recorder answers from state the disk does not hold. The crash that follows
\* takes the answer back and the recorder takes a fresh first proposal at a step
\* a proposer has already read.
\*
\* The invariant list is one line long on purpose. Withdrawing this rule breaks
\* StepZeroDurableStateWasNeverServed as well, and by a shorter behaviour, so a
\* configuration listing both reports that one and never reaches this one;
\* MCDurableStepZeroServed is where the other consequence is pinned.
SPECIFICATION Spec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = FALSE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
INVARIANTS
    ServedFirstIsStable
CHECK_DEADLOCK FALSE
