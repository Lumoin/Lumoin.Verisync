\* Algorithm 4 exactly as the paper writes it, under the assumption Section
\* 4.2.5 makes: the proposers have already agreed on who leads round one, so one
\* proposal carries the reserved priority. None of the defences is in force,
\* because none is needed here. This configuration is what says the model can
\* run a whole round and that the two-leader result below is about the leader
\* assumption and not about a mistake in the transcription.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK TRUE
