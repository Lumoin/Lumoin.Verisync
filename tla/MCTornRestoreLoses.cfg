\* Negative model: the accepted tear one step further on. The guarded crash
\* restores the mixed tuple and the register comes back holding a first
\* proposal other than the one a proposer already read at that step, which is
\* the loss Lemma C.10's argument cannot absorb. Same constants as the other
\* tearing negatives; this one lists the harm where MCTornAcceptedTear lists
\* the detectability gap.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    ServedFirstIsStable
CHECK_DEADLOCK FALSE
