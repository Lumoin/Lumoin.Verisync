\* Negative model: the placement argument as a run. The parent's TypeOK
\* asserts that the durable tuple is one a faithful host wrote, a tear
\* falsifies exactly that, and this red is why the corruption dimension lives
\* in a sibling module rather than inside QuePaxaDurable - in place it would
\* have to weaken a shipped invariant under a constant.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    TypeOK
CHECK_DEADLOCK FALSE
