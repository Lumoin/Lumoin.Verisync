    Servers = {1, 2, 3}
    Outsiders = {9}
    MaxTerm = 1
    FilterNonMembers = TRUE
    FilterBeforeTermRule = FALSE
    InjectsReplies = TRUE
    InjectsRequests = FALSE
    Nil = Nil
INVARIANTS
    TypeOK
    ElectionSafety
    VoteNamesAMember
CHECK_DEADLOCK FALSE
