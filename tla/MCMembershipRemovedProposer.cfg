\* The green that prices the non-member filter honestly. ProposerMustBeMember is
\* withdrawn, so a host outside the instance's configuration may put a record
\* forward, which is what a replica removed by a configuration change can still
\* do until something stops it.
\*
\* This is expected to be green, and the expectation is the whole point of the
\* row: a removed host that keeps proposing addresses the instance's own
\* configuration and is counted by nobody outside it, so the quorum is still a
\* majority of the right member set and agreement should be untouched. If the run
\* bears that out, the recorder-side membership filter is operability - it makes
\* "removed" mean something at the host - and never a safety device, and no
\* document in this arc may claim otherwise for as long as this configuration
\* stays green. If the run is red instead, the filter is load-bearing and D6 has
\* to be reopened.
\*
\* Hosts is strictly larger than the configuration, or there would be no
\* non-member to propose and the withdrawal would be inert.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = FALSE
    NoRecord = NoRecord
INVARIANTS
    TypeOK
    Agreement
    OneConfigurationPerInstance
    DecisionsCountOnlyMembers
    DecisionsCountOnlyCaughtUpHosts
    NoCrossClusterDecision
    LatestDecisionSurvives
CHECK_DEADLOCK FALSE
