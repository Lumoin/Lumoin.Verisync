\* The shipped protocol with the crash action enabled at every await. This
\* certifies the fetch-answer handler's apply order: the elements apply, whose
\* fold rides the same hook call as the entries it covers, precedes the
\* deferred local drops, so no mid-handler fault persists a context covering
\* entries this side never applied.
SPECIFICATION FairSpec
CONSTANTS
    BuggyDrainFold = FALSE
    BuggyEagerDrops = FALSE
    AllowCrash = TRUE
    AllowWindDown = TRUE
PROPERTIES
    FoldImpliesDelivery
CHECK_DEADLOCK FALSE
