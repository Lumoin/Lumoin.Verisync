\* The Figure 8 restriction in force, with no crashes. A leader counts replicas
\* only for an entry of its own term, and an inherited entry commits as a side
\* effect of committing one above it.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3, 4, 5}
    MaxTerm = 5
    MaxLogLength = 2
    CommitRequiresCurrentTerm = TRUE
    CountsOnlyPersistedReplicas = TRUE
    CrashesEnabled = FALSE
    NoLeader = NoLeader
INVARIANTS
    TypeOK
    LeaderCompleteness
CHECK_DEADLOCK FALSE
