\* MCConcreteMixedLeaderless again, with the downgrade narrowed to the round's
\* first step. The reserved priority earns a decision only where the fast path
\* reads it, which is that step alone, so a recorder that records a declined
\* claim verbatim above it defends nothing less and stops manufacturing the
\* second key that makes the mixed configuration diverge. It is green, which is
\* what separates the second key from the non-uniform configuration itself as
\* the cause of the divergence. The library downgrades at every step, so this
\* configuration pins a rule the shipped recorder does not apply.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- MixedLeaderless
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK TRUE
