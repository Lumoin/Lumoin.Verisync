\* One recorder honours no leader while the other two honour the agreed one,
\* under the downgrade the library applies, which is the round's first step
\* alone. The reserved priority earns a decision only where the fast path reads
\* it, which is that step, so a recorder that records a declined claim verbatim
\* above it defends nothing less and stops manufacturing the second key that
\* makes MCConcreteMixedLeaderlessWideDowngrade diverge. It is green, which is
\* what separates the second key from the non-uniform configuration itself as
\* the cause of that divergence. The green is not a licence to serve an instance
\* leaderless among led recorders: it holds at one leaderless recorder of three
\* and at this bound, and the library derives a uniform configuration rather
\* than resting on it.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- MixedLeaderless
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK TRUE
