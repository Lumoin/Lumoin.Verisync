\* Negative model: the restore is withdrawn, so a recorder that persisted
\* faithfully comes back as a fresh unwritten register anyway. This is the
\* library before its recorder could be rebuilt from durable state: the writes
\* happened, nothing read them, and the restarted recorder takes a fresh first
\* proposal at a step a proposer has already read.
\*
\* The invariant list is one line long for the reason MCDurableVolatileReply gives.
\* Withdrawing this rule also lets a host persist an unwritten register over one it
\* had already answered from, which breaks StepZeroDurableStateWasNeverServed at the
\* same depth, and a configuration listing both names one of them for reasons no run
\* reproduces.
SPECIFICATION Spec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = FALSE
    PersistsWholeRegister = TRUE
INVARIANTS
    ServedFirstIsStable
CHECK_DEADLOCK FALSE
