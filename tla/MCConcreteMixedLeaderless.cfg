\* One recorder honours no leader while the other two honour the agreed one,
\* which is the state a deployment reaches whenever a recorder has not yet
\* learned the committed version the leader is derived from. It looks harmless
\* and is not. The downgrade rewrites the priority at every step, so the
\* leader's single proposal exists as a reserved-priority record at the two
\* recorders that honour it and as a lowest-priority record at the one that does
\* not; the phase-one spread then fails to dominate that recorder's aggregate,
\* and a quorum holding only the rewritten copy carries an ordinary proposal
\* past it. The fast path is the whole-proposal one the implementation ships.
\* This configuration exists to make that unreachable-by-construction rule a
\* checked fact rather than a written one.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- MixedLeaderless
    DowngradeAtFirstStepOnly = FALSE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK FALSE
