\* The same outsider with the filter placed before the term rule. The term
\* becomes conditional on membership and the inflation lever closes, which is
\* what says the placement is a real choice rather than a detail.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3}
    Outsiders = {9}
    MaxTerm = 1
    FilterNonMembers = TRUE
    FilterBeforeTermRule = TRUE
    InjectsReplies = TRUE
    InjectsRequests = TRUE
    Nil = Nil
INVARIANTS
    TypeOK
    ElectionSafety
    NoTermInflation
    VoteNamesAMember
CHECK_DEADLOCK FALSE
