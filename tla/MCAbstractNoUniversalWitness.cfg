\* This negative model drops tcast property T2 and keeps T1: the second output
\* is an input that reached the replica being handed it, rather than one that
\* reached every live replica. Property T1 does not imply T2, because the
\* majorities different replicas hear from can intersect pairwise and still have
\* empty common intersection, so T2 is a genuine assumption of the abstract
\* layer and the concrete protocol has to buy it. Only the end-to-end property
\* is checked, so a red run means agreement itself broke and not merely an
\* intermediate lemma. TLC MUST report an Agreement violation.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = FALSE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
SYMMETRY ValueSymmetry
CHECK_DEADLOCK FALSE
