\* The same split genesis against the shipped defence: every record carries the
\* chain identity of the configuration that produced it, and a host declines a
\* record from another chain at the recorder and again at the learn. Nothing else
\* differs from the two negatives beside it.
\*
\* This is the configuration that says what the identity check buys, and it is
\* the half a matrix of negatives alone would leave unstated. With the check in
\* force the misprovisioned host cannot be counted by the others and cannot count
\* them, so its own member list never reaches a quorum and the majority chain
\* proceeds alone. The fork becomes a stranded host: progress is lost on one
\* machine, agreement is lost nowhere, and the operator sees a symptom that names
\* its own cause.
\*
\* Two boundaries must be read precisely, because the green does not certify past
\* either.
\*
\* The first is what this row can express at all. Giving each configuration its
\* own chain identity makes the carry-forward rule force every record to name the
\* deciding host's own configuration, so no membership change is representable
\* here: the green certifies the identity check over a frozen membership, and
\* four of the seven invariants it lists hold structurally rather than through
\* anything the run explores. What exercises a change is the shipped and disjoint
\* rows, and what this row adds to them is the chain check and nothing else.
\*
\* The second is the deployment error the check does not repair. It converts a
\* split into two chains, and here the minority chain
\* cannot reach a quorum of its own list. A split that leaves both sides holding
\* a quorum of their own lists produces two live registers instead, which is a
\* worse deployment error that this defence makes visible rather than repairs -
\* the two carry different identities and can never merge, where without the
\* check they would silently interleave at colliding versions.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- SplitMembers
    Cluster <- ClusterPerConfig
    Genesis <- SplitGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    TypeOK
    Agreement
    OneConfigurationPerInstance
    DecisionsCountOnlyMembers
    DecisionsCountOnlyCaughtUpHosts
    NoCrossClusterDecision
    LatestDecisionSurvives
CHECK_DEADLOCK FALSE
