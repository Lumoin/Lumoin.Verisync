\* The headline claim: no overlap is required between one configuration and the
\* next. The change here is to a member set sharing nothing with the outgoing
\* one - {1,2,3} becomes {4,5} - so the two configurations have no host in
\* common and therefore no pair of quorums that could intersect.
\*
\* If this configuration were red the whole shape would be wrong, because the
\* design's central derivation is that a decided record is preserved by agreement
\* within its own instance over its own fixed recorder set, and never by an
\* overlap between consecutive configurations. What it costs is availability
\* rather than safety: nothing in {4,5} can serve the next instance until it has
\* learned the installing record, and until then the register cannot move at all.
\* That asymmetry is the whole of the operator guidance and none of the safety
\* argument.
\*
\* The bound is what makes the claim readable: the two majorities are {4,5} and
\* any two of {1,2,3}, which share no host, so a configuration whose member sets
\* merely overlapped could not express what this one certifies. The chain runs
\* three versions, so the disjoint change is also decided from a configuration
\* that a decision installed rather than only from genesis, and the claim covers
\* a change chained onto a change.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- DisjointMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 3
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    TypeOK
    Agreement
    OneConfigurationPerInstance
    DecisionsCountOnlyMembers
    DecisionsCountOnlyCaughtUpHosts
    NoCrossClusterDecision
    LatestDecisionSurvives
CHECK_DEADLOCK FALSE
