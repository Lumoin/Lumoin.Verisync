\* Two believed leaders with only the configured-leader defence in force: each
\* recorder honours the reserved priority solely on a proposal from the leader
\* the instance was configured with, and records any other claim at the lowest
\* ordinary priority. The fast path is left as the paper writes it. This
\* isolates the defence that stops two reserved-priority proposals from
\* coexisting at all, as against MCConcreteIdenticalKeyOnly, which leaves them
\* coexisting and only refuses to decide on them.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK TRUE
