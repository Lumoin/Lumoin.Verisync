\* The shipped behaviour: nothing distinguishes two stores answering under one identity, so two
\* quorums form that intersect only at an identity the two hosts disagree about, and both decide.
SPECIFICATION Spec

CONSTANTS
    Identities = {ia, ib, ic}
    Incarnations = {1, 2}
    Values = {v1, v2}
    Quorum = 2
    DetectorOn = FALSE
    BindingDurable = TRUE
    NoValue = noValue
    NoIncarnation = noIncarnation

INVARIANTS
    TypeOK
    Agreement
