\* Negative model: the accepted tear that moves the other half of a reply.
\* A mix can keep the first proposal and replace the aggregate carried from
\* the step below, which a proposer's phase two compares its template against
\* and its phase three carries forward, so the crash takes back a value a
\* proposer acted on without touching the field the fast path reads.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    ServedPriorAggregateIsStable
CHECK_DEADLOCK FALSE
