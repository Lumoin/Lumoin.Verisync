\* Negative model: writes can tear and the restore takes whatever it finds.
\* A torn restore then installs a register state the register cannot reach on
\* its own - a step above zero carrying no first proposal - which is what the
\* refusal rules exist to prevent and what withdrawing them admits.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = FALSE
INVARIANTS
    RegisterHoldsOnlyRecorderStates
CHECK_DEADLOCK FALSE
