\* The hazard this module exists for. Both proposers believe they lead round
\* one, so both attach the reserved priority, and no defence is in force.
\* Recorders record whichever reserved-priority proposal reaches them first, two
\* quorums of all-reserved replies can then carry different values, and
\* Algorithm 4's fast path returns the value from any reply in the quorum. This
\* is the hypothesis Lemma C.10's proof spends one sentence on - that only the
\* leader's proposal has priority H - and it is the one safety property Fast
\* CASPaxos never has to carry. TLC MUST report an Agreement violation.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
CHECK_DEADLOCK FALSE
