\* Negative model: the persist-before-reply obligation is withdrawn, so a commit
\* may rest on a replica holding the entry only in memory. The crash that
\* follows takes the entry back and the commit rests on nothing durable.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3, 4, 5}
    MaxTerm = 3
    MaxLogLength = 2
    CommitRequiresCurrentTerm = TRUE
    CountsOnlyPersistedReplicas = FALSE
    CrashesEnabled = TRUE
    NoLeader = NoLeader
INVARIANTS
    CommittedIsDurableAtAQuorum
CHECK_DEADLOCK FALSE
