\* Algorithm 1 as the paper states it, over every starting assignment of
\* preferences, with no crashes. The five Appendix B lemmas hold through every
\* legal tcast outcome the two properties admit. The deadlock check asserts that
\* no mid-round state runs out of such outcomes.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    CrossNodeSubset
    Cardinalities
SYMMETRY ValueSymmetry
CHECK_DEADLOCK TRUE
