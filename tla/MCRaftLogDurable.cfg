\* Both rules in force with crashes enabled. A commit counts only replicas that
\* have made the entry durable, so no crash can take back what a quorum was
\* counted on.
SPECIFICATION Spec
CONSTANTS
    Servers = {s1, s2, s3, s4, s5}
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    s5 = s5
    MaxTerm = 3
    MaxLogLength = 2
    CommitRequiresCurrentTerm = TRUE
    CountsOnlyPersistedReplicas = TRUE
    CrashesEnabled = TRUE
    NoLeader = NoLeader
INVARIANTS
    TypeOK
    LeaderCompleteness
    CommittedIsDurableAtAQuorum
SYMMETRY ServerSymmetry
CHECK_DEADLOCK FALSE
