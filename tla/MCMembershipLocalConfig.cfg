\* Negative model: the configuration is read from each host's own deployment file
\* rather than derived from the record it holds. This is the rule the whole
\* design rests on, withdrawn.
\*
\* Genesis still governs the first instance, so the divergence appears only once
\* a record exists to disagree with, which is what makes the red a consequence
\* rather than an artefact of the initial state. Once the first version is
\* decided and two hosts have learned it, both serve the second instance and one
\* reads {1,2,3} while the other reads {3,4,5}. Two quorums that never meet then
\* exist for one instance, which is the split-config hazard at its own origin.
\*
\* This configuration lists OneConfigurationPerInstance alone. Agreement is
\* expected to be reachable here too, one decision further on, and the run that
\* settles which invariant TLC reports first is the merged one - the assignment
\* below is an expectation until that run exists, not an argument.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- DividedLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = FALSE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    OneConfigurationPerInstance
CHECK_DEADLOCK FALSE
