\* Negative model: the filter sits after the term rule, which is where the
\* shipped code puts it, so an outsider that cannot complete a quorum can still
\* move a member to a term no member campaigned at. The lever is the term rule
\* being universal, not the tally.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3}
    Outsiders = {9}
    MaxTerm = 1
    FilterNonMembers = TRUE
    FilterBeforeTermRule = FALSE
    InjectsReplies = FALSE
    InjectsRequests = TRUE
    Nil = Nil
INVARIANTS
    NoTermInflation
CHECK_DEADLOCK FALSE
