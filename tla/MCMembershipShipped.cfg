\* The whole thesis with every rule in force: a configuration decided through the
\* register, activating at the instance boundary the version gate already
\* enforces, over a deployment whose genesis files agree.
\*
\* The chain runs three versions and the configuration changes across them, from
\* {1,2,3} to {3,4,5} and back, so the joiners must learn the installing record
\* before they can be counted, the outgoing members stop being counted the moment
\* the boundary passes, and the second change is decided under a configuration
\* that is itself the product of a decision rather than of genesis - the
\* derivation's inductive step exercised rather than assumed. Hosts is strictly
\* larger than either configuration, so a host outside the member set exists in
\* every state rather than only in the negative that needs one.
\*
\* Deadlock is not checked, here or anywhere in this matrix. The chain is bounded
\* by MaxVersion, so every run reaches a state with nothing left to decide and the
\* terminal state is the bound rather than a defect.
\*
\* The cluster arm of the rules is inert in this row and in every other row
\* binding OneCluster: one chain identity is carried by every configuration, so
\* both sides of the identity check are equal by construction. What exercises
\* ClusterBinds is the genesis trio, and nothing here should be read as covering
\* it.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4, 5}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- ChangeMembers
    Cluster <- OneCluster
    Genesis <- UniformGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 3
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = TRUE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    TypeOK
    Agreement
    OneConfigurationPerInstance
    DecisionsCountOnlyMembers
    DecisionsCountOnlyCaughtUpHosts
    NoCrossClusterDecision
    LatestDecisionSurvives
CHECK_DEADLOCK FALSE
