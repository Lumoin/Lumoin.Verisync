\* Negative model: one host provisioned with a different genesis member list, and
\* no chain identity to notice. This is the base case the induction cannot close,
\* because genesis is an operator writing the same list into every file and no
\* derivation can make a deployment fact agreed.
\*
\* The witness is the one the panel settled on, and its shape matters. Two
\* majorities of one member set can share a single recorder, and a shared
\* recorder is not a fork: in QuePaxa its aggregate carries the decided proposal
\* forward. A genuine fork therefore needs quorums that are disjoint, and a split
\* genesis is what affords them. Hosts 1, 2 and 3 hold {1,2,3} while host 4 holds
\* {1,2,4}; host 3 decides version one on {2,3}, and host 4 decides a different
\* version one on {1,4}. The two quorums share nothing, so nothing in either
\* instance carries the other's proposal, and both records stand.
\*
\* The constants are bound-honest for exactly that reason: the two member sets
\* must afford a disjoint pair of majorities between them, or under the binding
\* guard this red is unreachable rather than merely mis-witnessed.
\*
\* This configuration lists Agreement alone. NoCrossClusterDecision is reachable
\* strictly earlier here - a single mixed quorum breaks it, and a fork needs two
\* decisions - which is why the sibling configuration carrying that invariant has
\* these same constants rather than sharing this file.
SPECIFICATION Spec
CONSTANTS
    Hosts = {1, 2, 3, 4}
    Configs = {1, 2}
    Clusters = {1, 2}
    Members <- SplitMembers
    Cluster <- ClusterPerConfig
    Genesis <- SplitGenesis
    LocalConfig <- UniformLocal
    MaxVersion = 2
    ConfigDerivedFromRecord = TRUE
    VersionGateBinds = TRUE
    RepliesOnlyFromMembers = TRUE
    ClusterBinds = FALSE
    DecommissionGated = TRUE
    ProposerMustBeMember = TRUE
    NoRecord = NoRecord
INVARIANTS
    Agreement
CHECK_DEADLOCK FALSE
