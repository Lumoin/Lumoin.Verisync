\* Negative model: the persist-before-reply obligation withdrawn again, pinned
\* on the premise a host's step-zero short circuit rests on. Rebuilding a
\* step-zero durable state as an unwritten register is safe only because such a
\* state has answered nothing, and what makes that true is the reply waiting for
\* the write. Without it a recorder answers from a step its disk has never
\* reached, and the short circuit then discards an answer a proposer holds.
\*
\* The constants are MCDurableVolatileReply's exactly. TLC stops at its first
\* violation, so one configuration cannot demonstrate two consequences of one
\* withdrawn rule, and each of the two names the invariant it exists for. This
\* one is reached first, and the premise it breaks is a state predicate over the
\* durable state and the ghost, so the violation stands before any crash is
\* needed. Where the loss the short circuit would then cause is staged across a
\* restart is MCDurableRecorder, which lists the same invariant and crashes
\* against it throughout.
SPECIFICATION Spec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = FALSE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
INVARIANTS
    StepZeroDurableStateWasNeverServed
CHECK_DEADLOCK FALSE
