\* Negative model A: the drain epilogue folds a captured context on a bare
\* wind-down. TLC MUST report a FoldImpliesDelivery violation: the fold covers
\* transfers that never arrive. If this run is green the model is too abstract
\* to trust.
SPECIFICATION FairSpec
CONSTANTS
    BuggyDrainFold = TRUE
    BuggyEagerDrops = FALSE
    AllowCrash = FALSE
    AllowWindDown = TRUE
PROPERTIES
    FoldImpliesDelivery
CHECK_DEADLOCK FALSE
