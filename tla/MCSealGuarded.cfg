\* This configuration enforces the uncommissioned host coordination surface
\* in full, both halves: the group probe-fold at seal time ("a straggler must
\* never seal") plus the write barrier through the apply window. With it,
\* every fair execution keeps re-converging on the committed seal - the full
\* gate closes the liveness hole, and MCSealProbeOnly shows the probe-fold
\* half alone does not.
SPECIFICATION FairSpec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    MaxC = 1
    AllowAdopt = FALSE
    AllowPartition = FALSE
    SealGuard = TRUE
    WriteBarrier = TRUE
    NoCommit = NoCommit
PROPERTIES
    GroupConverges
CHECK_DEADLOCK FALSE
