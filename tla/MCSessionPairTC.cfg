\* The shipped protocol under arbitrary wind-down with no crash. The TC
\* fold-delivery theorem holds: every fold's insert-bearing transfers are
\* eventually applied.
SPECIFICATION FairSpec
CONSTANTS
    BuggyDrainFold = FALSE
    BuggyEagerDrops = FALSE
    AllowCrash = FALSE
    AllowWindDown = TRUE
INVARIANTS
    TypeOK
    InterruptedZeroFolds
    TerminalConverged
PROPERTIES
    FoldImpliesDelivery
CHECK_DEADLOCK FALSE
