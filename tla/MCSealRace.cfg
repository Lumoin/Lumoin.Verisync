\* This negative model needs no partition: a healthy member seals before its
\* latest insert has gossiped, and the base-changing commit wedges the rest
\* of the group behind the generation fence. TLC MUST report a GroupConverges
\* violation. The configuration differs from MCSealGuarded by exactly the two
\* gate knobs.
SPECIFICATION FairSpec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    MaxC = 1
    AllowAdopt = FALSE
    AllowPartition = FALSE
    SealGuard = FALSE
    WriteBarrier = FALSE
    NoCommit = NoCommit
PROPERTIES
    GroupConverges
CHECK_DEADLOCK FALSE
