\* Negative model: writes can tear, and some torn tuple lies outside what the
\* restore accepts. This is the caught half of the module's pair - the rules
\* do refuse tears - and its earliest violations include a step-zero tuple
\* carrying a proposal, the one snapshot shape the versioned host's own
\* restore refuses, reachable here and nowhere else in this directory.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = FALSE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    DurableStateIsRestorable
CHECK_DEADLOCK FALSE
