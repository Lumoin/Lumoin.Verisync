\* Negative model B: the local drops apply - and fold - with the fetch still
\* outstanding. TLC MUST report a violation: the eager fold covers the
\* never-fetched entries' dots, and it leaves an Interrupted initiator with a
\* fold. If this run is green the model is too abstract to trust.
SPECIFICATION FairSpec
CONSTANTS
    BuggyDrainFold = FALSE
    BuggyEagerDrops = TRUE
    AllowCrash = FALSE
    AllowWindDown = TRUE
INVARIANTS
    InterruptedZeroFolds
PROPERTIES
    FoldImpliesDelivery
CHECK_DEADLOCK FALSE
