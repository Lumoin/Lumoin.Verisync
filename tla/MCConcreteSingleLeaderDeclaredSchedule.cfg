\* The declared-schedule defence under the assumption Section 4.2.5 makes, which
\* is that the proposers have already agreed on who leads. Every proposer then
\* declares the same leader, no recorder ever sees a second declaration, and no
\* request is ever refused. This configuration exists to say that the defence
\* costs nothing when the schedule is agreed: it must match MCConcreteSingleLeader
\* state for state and depth for depth, and it must still check deadlock, because
\* nothing here is blocked and every terminal state should be one the protocol
\* ran out of work in.
\*
\* A deviation in either count would mean the defence is not inert on the agreed
\* path, which would be a reason to reject it whatever the two-leader run says.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = TRUE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK TRUE
