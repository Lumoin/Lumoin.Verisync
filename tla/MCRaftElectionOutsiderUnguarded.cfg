\* Negative model: an outsider injects a granted vote reply and the tally counts
\* it, which is what a node that never checks the sender does. Two candidates in
\* one term each complete a majority count while only one of them holds a
\* majority of the membership, so election safety fails.
SPECIFICATION Spec
CONSTANTS
    Servers = {1, 2, 3}
    Outsiders = {9}
    MaxTerm = 1
    FilterNonMembers = FALSE
    FilterBeforeTermRule = FALSE
    InjectsReplies = TRUE
    InjectsRequests = FALSE
    Nil = Nil
INVARIANTS
    ElectionSafety
CHECK_DEADLOCK FALSE
