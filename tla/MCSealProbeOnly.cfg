\* This negative model runs the seal-time group probe-fold WITHOUT the write
\* barrier: an insert landing between the seal and a straggling member's
\* apply fails the apply-side probe forever. TLC MUST report a GroupConverges
\* violation, pinning that the uncommissioned gate's two halves are only
\* jointly sufficient. The configuration differs from MCSealGuarded by
\* exactly the WriteBarrier knob.
SPECIFICATION FairSpec
CONSTANTS
    Members = {m1, m2, m3}
    m1 = m1
    m2 = m2
    m3 = m3
    MaxC = 1
    AllowAdopt = FALSE
    AllowPartition = FALSE
    SealGuard = TRUE
    WriteBarrier = FALSE
    NoCommit = NoCommit
PROPERTIES
    GroupConverges
CHECK_DEADLOCK FALSE
