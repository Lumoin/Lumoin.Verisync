\* The store faithful and atomic with the restore guard withdrawn. The run
\* must reproduce MCTornAtomic digit for digit, and with it MCDurableRecorder,
\* which separates two certifications the guarded run alone would conflate:
\* the extension is conservative, and the refusal rules refuse nothing a
\* faithful host writes - an over-strict shipped rule would make the two
\* atomic state spaces differ.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = TRUE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = FALSE
INVARIANTS
    TypeOK
    TornTypeOK
    ServedFirstIsStable
    ServedPriorAggregateIsStable
    StepZeroDurableStateWasNeverServed
    DurableStateIsRestorable
    DurableRestoreKeepsEveryAnswer
    RegisterHoldsOnlyRecorderStates
CHECK_DEADLOCK TRUE
