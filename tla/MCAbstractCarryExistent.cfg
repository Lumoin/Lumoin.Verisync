\* This negative model assigns v from the existent set rather than the common
\* set. The delivered value is unaffected in a round that decides, because the
\* predicate forces the two bests to coincide there, so the defect can only
\* surface through the carry: a replica that does not decide takes a
\* higher-priority value that was never common into the next round, and that
\* round can decide it after another replica already decided otherwise. TLC MUST
\* report an Agreement violation.
SPECIFICATION Spec
CONSTANTS
    Replicas = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {0, 1}
    InitialPreferences <- AllPreferences
    MaxRound = 2
    Faulty = {}
    UniversalWitness = TRUE
    Tiebreak = TRUE
    TieDetection = FALSE
    DecideOnCommon = FALSE
    CarryExistent = TRUE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
SYMMETRY ValueSymmetry
CHECK_DEADLOCK FALSE
