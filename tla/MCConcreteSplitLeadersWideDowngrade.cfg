\* Two recorders honour one leader and the third honours another, which is the
\* split configuration a versioned register must make unreachable, with the
\* downgrade applied at every step. It differs from MCConcreteTwoLeaders, where
\* the defence is switched off entirely: here the defence is in force at every
\* recorder and the recorders simply disagree about whom it protects. The fast
\* path is the whole-proposal one the implementation ships, so a violation here
\* is one the shipped code can reach rather than one the permissive fast-path
\* arm manufactures. MCConcreteSplitLeadersNarrowDowngrade is the same split
\* under the rule the library applies, and it is red as well; the split is what
\* the deployment obligation is written against, and neither downgrade width
\* rescues it.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- SplitLeaders
    DowngradeAtFirstStepOnly = FALSE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK FALSE
