\* MCConcreteSplitLeaders with the downgrade narrowed to the round's first step,
\* which is the control for MCConcreteMixedLeaderlessNarrowDowngrade. Narrowing
\* the rule must not weaken the defence it narrows: two recorders honouring one
\* leader and a third honouring another still puts two reserved-priority
\* proposals in play at the step the fast path reads, so this is red. Its being
\* red is what distinguishes a narrowing that is precise from one that is merely
\* vacuous, and it is the precondition on reading anything into its companion
\* configuration.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- SplitLeaders
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = TRUE
    ReservedFromLeaderOnly = TRUE
    RecorderBindsLeader = FALSE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
    Validity
    ReplyStepAtLeastRequest
    StepDiscipline
CHECK_DEADLOCK FALSE
