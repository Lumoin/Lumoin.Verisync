\* The store faithful, every write atomic, the restore guard in force. The
\* run must reproduce MCDurableRecorder's state space digit for digit, which
\* says the sibling is a conservative extension of the parent: with nothing
\* torn and nothing fabricated, the guard never fires and GuardedCrash is
\* Crash. Every invariant the parent checks holds here, and both new durable
\* invariants hold beside them.
SPECIFICATION TornSpec
CONSTANTS
    Proposals = {1, 2, 3}
    FirstStep = 4
    MaxStep = 7
    RepliesAfterPersist = TRUE
    RestoresFromDurableState = TRUE
    PersistsWholeRegister = TRUE
    WritesTupleAtomically = TRUE
    StoreReturnsWhatItWrote = TRUE
    RestoreRefusesImpossibleStates = TRUE
INVARIANTS
    TypeOK
    TornTypeOK
    ServedFirstIsStable
    ServedPriorAggregateIsStable
    StepZeroDurableStateWasNeverServed
    DurableStateIsRestorable
    DurableRestoreKeepsEveryAnswer
    RegisterHoldsOnlyRecorderStates
CHECK_DEADLOCK TRUE
