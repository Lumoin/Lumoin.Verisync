\* The reachability witness for the guarded model, checked as a deliberate red. Agreement is satisfied
\* by the initial state, so a detector that refused every answer would keep MCIncarnationGuarded green
\* while deciding nothing at all. This configuration is that one, and the invariant it must break says
\* nothing has been decided: the red is what proves the guarded model still reaches a decision, and it
\* is what the guarded green is worth anything against.
SPECIFICATION Spec

CONSTANTS
    Identities = {ia, ib, ic}
    Incarnations = {1, 2}
    Values = {v1, v2}
    Quorum = 2
    DetectorOn = TRUE
    BindingDurable = TRUE
    NoValue = noValue
    NoIncarnation = noIncarnation

INVARIANTS
    TypeOK
    NothingDecided
