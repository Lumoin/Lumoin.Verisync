\* Two believed leaders with only the first-claim binding in force: each
\* recorder binds whichever proposer it first sees claim the reserved priority
\* and declines every other claim thereafter. The binding is per recorder and
\* first-come, so nothing makes the recorders agree on whom they bound, and two
\* recorders reached in the opposite order bind opposite proposers. This
\* isolates first-come binding from the configured binding in
\* MCConcreteConfiguredLeaderOnly and says which of the two the guard has to be.
SPECIFICATION Spec
CONSTANTS
    Proposers = {1, 2}
    Recorders = {1, 2, 3}
    Values = {v1, v2}
    v1 = v1
    v2 = v2
    Priorities = {1, 2}
    H = 3
    Prefers <- DistinctPreferences
    Leaders = {1, 2}
    ConfiguredLeader = 1
    RecorderLeader <- UniformLeader
    DowngradeAtFirstStepOnly = TRUE
    MaxStep = 7
    IdenticalKeyFastPath = FALSE
    ReservedFromLeaderOnly = FALSE
    RecorderBindsLeader = TRUE
    DeclaredScheduleBinds = FALSE
    NoValue = NoValue
INVARIANTS
    TypeOK
    Agreement
CHECK_DEADLOCK FALSE
